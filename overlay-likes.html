<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Overlay - Curtidas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    overflow: hidden;
    width: 300px;
    height: 400px;
    position: relative;
  }
  .heart {
    position: absolute;
    bottom: 0;
    opacity: 0.9;
    animation: floatUp 3s ease-in forwards;
  }
  .heart svg { display: block; }
  .heart.emoji { font-size: var(--sz, 28px); line-height: 1; }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0.9; }
    100% { transform: translateY(-380px) translateX(var(--drift, 0px)) scale(1.1); opacity: 0; }
  }
</style>
</head>
<body>

<script>
const API_URL = "http://localhost:5000/api";
const params = new URLSearchParams(window.location.search);
const username = params.get('user') || '';
let lastCount = 0;

// Catalogo de icones em SVG (um unico "fill", por isso aceitam qualquer cor)
const ICON_PATHS = {
  "heart": "M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.3 1 4 2.2C10.7 6 12 5 14 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z",
  "heart-sparkle": "M12 20.5s-6.8-4.2-8.7-8.3C1.6 8.7 3.2 5.7 6.2 5.7c1.8 0 3 .9 3.8 2C10.8 6.6 12 5.7 13.8 5.7c3 0 4.6 3 2.9 6.5C14.8 16.3 12 20.5 12 20.5zM18.5 3l.6 1.6L20.7 5l-1.6.6L18.5 7l-.6-1.4L16.3 5l1.6-.4z",
  "fire": "M12 2s2 2.5 2 5c0 1-.5 1.8-1 2.5.8-.2 1.8-1 2.2-2 1.6 1.6 2.8 3.8 2.8 6 0 3.9-3.1 7-7 7s-7-3.1-7-7c0-3 1.7-4.9 3-6.5-.1 1 .2 1.8.8 2.3C7.5 7.8 8 5 12 2z",
  "star": "M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z",
  "thunder": "M13 2 3 14h6l-1 8 11-14h-7z",
  "crown": "M3 8l4 3 5-6 5 6 4-3-2 11H5zM5 20h14v2H5z",
  "diamond": "M6 3h12l4 6-10 12L2 9z",
  "thumbs-up": "M2 10h4v11H2zM9 10l1-6a2 2 0 0 1 4 0l-.5 4H19a2 2 0 0 1 2 2.2l-1.2 7A2 2 0 0 1 17.8 19H9z",
  "rocket": "M12 2c3 2 5 5.5 5 9.5 0 2-1 4-2 5l-1 3-2-2-2 2-1-3c-1-1-2-3-2-5C7 7.5 9 4 12 2zM9 17l-3 3 1-4zM15 17l3 3-1-4z",
  "party": "M3 21l3-9 9 3zM9 5l1.8 1.8M14 3l1.8 1.8M18 7l1.8 1.8M5 13l1.8 1.8"
};

// Icones que nao dao pra fazer so com "fill" (emoji colorido da marca, por exemplo)
const EMOJI_ICONS = {
  "alien": "👽"
};

// Estado atual, pode ser atualizado via URL (primeira carga) ou via postMessage (edicao ao vivo)
let state = {
  color: params.get('color') || '#30e070',
  icon: params.get('icon') || 'alien',
  size: params.get('size') || '28',
  speed: parseFloat(params.get('speed') || '3'),
  burst: parseInt(params.get('burst') || '1', 10),
  direction: params.get('direction') || 'up',
};

// Escuta atualizacoes ao vivo vindas do painel (sem precisar recarregar o iframe)
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'tiquebom-update') {
    const p = event.data.params;
    state.color = p.color ?? state.color;
    state.icon = p.icon ?? state.icon;
    state.size = p.size ?? state.size;
    state.speed = p.speed !== undefined ? parseFloat(p.speed) : state.speed;
    state.burst = p.burst !== undefined ? parseInt(p.burst, 10) : state.burst;
    state.direction = p.direction ?? state.direction;
  }
});

function driftFor() {
  if (state.direction === 'diagonal-left') return -(Math.random() * 80 + 40);
  if (state.direction === 'diagonal-right') return Math.random() * 80 + 40;
  return Math.random() * 60 - 30;
}

function spawnHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';

  const emoji = EMOJI_ICONS[state.icon];
  if (emoji) {
    heart.classList.add('emoji');
    heart.style.setProperty('--sz', state.size + 'px');
    heart.textContent = emoji;
  } else {
    const path = ICON_PATHS[state.icon] || ICON_PATHS.heart;
    heart.innerHTML = `<svg viewBox="0 0 24 24" width="${state.size}" height="${state.size}" fill="${state.color}"><path d="${path}"/></svg>`;
  }

  heart.style.animationDuration = state.speed + 's';
  heart.style.left = (Math.random() * 80 + 10) + '%';
  heart.style.setProperty('--drift', driftFor() + 'px');
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), state.speed * 1000);
}

async function pollLikes() {
  if (!username) return;
  try {
    const response = await fetch(`${API_URL}/interactions/${username}`);
    if (response.ok) {
      const data = await response.json();
      const total = data.interactions.total_likes || 0;
      if (total > lastCount) {
        const diff = Math.min(total - lastCount, 10) * state.burst;
        for (let i = 0; i < diff; i++) {
          setTimeout(spawnHeart, i * 100);
        }
      }
      lastCount = total;
    }
  } catch (error) {
    console.error('Erro ao buscar curtidas:', error);
  }
  setTimeout(pollLikes, 1000);
}

pollLikes();
</script>

</body>
</html>
